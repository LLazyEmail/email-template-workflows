name: Action metadata check

on:
  push:
    paths:
      - action.yml
      - .github/workflows/render-email-template.yml
  pull_request:
    paths:
      - action.yml
      - .github/workflows/render-email-template.yml
  workflow_dispatch:

jobs:
  metadata:
    name: Validate action.yml shape
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require composite action metadata
        run: |
          set -euo pipefail
          test -f action.yml
          grep -q 'using: "composite"' action.yml
          grep -q 'shell: bash' action.yml || {
            echo "Composite run steps must set shell: bash"
            exit 1
          }
