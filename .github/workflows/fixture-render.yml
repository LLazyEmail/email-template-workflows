name: Fixture render

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: fixture-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render fixture templates with the local action
        uses: ./
        with:
          working-directory: fixtures/consumer
          templates: |
            src/newsletter.md:generated/newsletter.html
            src/welcome.md:generated/welcome.html
          extra-args: --title Fixture
          artifact-directory: generated
          upload-artifact: true
          artifact-name: fixture-email

      - name: Assert HTML was written
        run: |
          set -euo pipefail
          test -s fixtures/consumer/generated/newsletter.html
          test -s fixtures/consumer/generated/welcome.html
          test -s fixtures/consumer/generated/index.html
          count=$(grep -c '<li>' fixtures/consumer/generated/index.html)
          test "$count" -ge 2

  command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render via command instead of --input/--output
        uses: ./
        with:
          working-directory: fixtures/consumer
          command: npm run render-all
          artifact-directory: generated
          upload-artifact: true
          artifact-name: fixture-command
          pr-comment: false

      - name: Assert command-mode HTML
        run: |
          set -euo pipefail
          test -s fixtures/consumer/generated/newsletter.html
          test -s fixtures/consumer/generated/welcome.html
          test -s fixtures/consumer/generated/index.html
          test -s fixtures/consumer/generated/rendered.txt
          count=$(grep -c '<li>' fixtures/consumer/generated/index.html)
          test "$count" -ge 2
