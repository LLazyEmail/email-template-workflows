name: Render Email Template
description: Build and render email templates into static HTML

inputs:
  input:
    description: Path to source Markdown/AST
    required: true
  output:
    description: Path to save compiled HTML
    required: true
  node-version:
    description: Node.js version to install on the runner
    required: false
    default: "24"
  build-script:
    description: npm script that compiles the email (consumer package.json)
    required: false
    default: build-email
  validate-script:
    description: npm script that validates compiled HTML. Set empty to skip.
    required: false
    default: validate-email
  upload-artifact:
    description: Upload the rendered HTML as a workflow artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: rendered-email

outputs:
  html-path:
    description: Path to the generated HTML file
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm install
      shell: bash
    - run: npm run ${{ inputs.build-script }} -- --input "${{ inputs.input }}" --output "${{ inputs.output }}"
      shell: bash
    - if: ${{ inputs.validate-script != '' }}
      run: npm run ${{ inputs.validate-script }} -- --file "${{ inputs.output }}"
      shell: bash
    - if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
