name: Render Email Template
description: Build and render one or more email templates into static HTML

inputs:
  input:
    description: Path to a single source Markdown/AST, relative to working-directory. Ignored when templates or command is set.
    required: false
    default: ""
  output:
    description: Path to save a single compiled HTML file, relative to working-directory. Ignored when templates or command is set.
    required: false
    default: ""
  templates:
    description: |
      One template per line, as input:output, both relative to working-directory.
      Example:
        src/welcome.md:generated/welcome.html
        src/invoice.md:generated/invoice.html
      When set, input and output are ignored. Ignored when command is set.
    required: false
    default: ""
  command:
    description: |
      Shell command run after npm install, instead of the build-script loop.
      Use this for a catalog engine, for example `npx generate-template --all --out=generated`
      or `npm run sandbox`. Set artifact-directory to the folder that command writes.
    required: false
    default: ""
  node-version:
    description: Node.js version to install on the runner
    required: false
    default: "24"
  working-directory:
    description: Directory that contains package.json. Default is the generated output folder.
    required: false
    default: generated
  build-script:
    description: npm script that compiles the email (consumer package.json). Ignored when command is set.
    required: false
    default: build-email
  validate-script:
    description: npm script that validates compiled HTML. Set empty to skip. Ignored when command is set.
    required: false
    default: validate-email
  extra-args:
    description: Extra arguments appended after --input and --output. Ignored when command is set.
    required: false
    default: ""
  cache:
    description: setup-node cache mode (npm, yarn, pnpm). Empty skips cache so a missing lockfile does not fail the job.
    required: false
    default: ""
  upload-artifact:
    description: Upload the rendered HTML (plus index.html) as a workflow artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: rendered-email
  artifact-directory:
    description: Directory to index and upload, relative to working-directory. Empty uses the directory of the rendered HTML. Required in practice when command is set.
    required: false
    default: ""

outputs:
  html-path:
    description: Path to the first generated HTML file, relative to the workspace
    value: ${{ steps.render.outputs.html-path }}
  html-count:
    description: Number of HTML files rendered
    value: ${{ steps.render.outputs.html-count }}

runs:
  using: "composite"
  steps:
    - if: ${{ inputs.cache != '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/**/package-lock.json
    - if: ${{ inputs.cache == '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - run: npm install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Render templates
      id: render
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEMPLATES: ${{ inputs.templates }}
        SINGLE_INPUT: ${{ inputs.input }}
        SINGLE_OUTPUT: ${{ inputs.output }}
        BUILD_SCRIPT: ${{ inputs.build-script }}
        VALIDATE_SCRIPT: ${{ inputs.validate-script }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        COMMAND: ${{ inputs.command }}
        WORKDIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        rendered=()
        if [ -n "$COMMAND" ]; then
          echo "running command: $COMMAND"
          bash -lc "$COMMAND"
          if [ -z "$ARTIFACT_DIRECTORY" ]; then
            echo "command mode requires artifact-directory"
            exit 1
          fi
          outdir="$ARTIFACT_DIRECTORY"
          mkdir -p "$outdir"
          while IFS= read -r f; do
            rendered+=("$f")
          done < <(find "$outdir" -maxdepth 1 -name '*.html' ! -name 'index.html' | sort)
        else
          mapfile -t pairs < <(
            if [ -n "$TEMPLATES" ]; then
              printf '%s\n' "$TEMPLATES"
            else
              printf '%s:%s\n' "$SINGLE_INPUT" "$SINGLE_OUTPUT"
            fi
          )
          for raw in "${pairs[@]}"; do
            line=$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            input=${line%%:*}
            output=${line#*:}
            if [ -z "$input" ] || [ -z "$output" ] || [ "$input" = "$output" ]; then
              echo "invalid template line (expected input:output): $line"
              exit 1
            fi
            echo "rendering $input -> $output"
            npm run "$BUILD_SCRIPT" -- --input "$input" --output "$output" $EXTRA_ARGS
            if [ -n "$VALIDATE_SCRIPT" ]; then
              npm run "$VALIDATE_SCRIPT" -- --file "$output"
            fi
            test -s "$output"
            rendered+=("$output")
          done
          if [ -n "$ARTIFACT_DIRECTORY" ]; then
            outdir="$ARTIFACT_DIRECTORY"
          else
            outdir=$(dirname "${rendered[0]}")
          fi
        fi
        if [ "${#rendered[@]}" -eq 0 ]; then
          echo "No templates rendered. Set command plus artifact-directory, templates, or both input and output."
          exit 1
        fi
        mkdir -p "$outdir"
        {
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rendered emails</title></head><body>'
          echo '<h1>Rendered emails</h1>'
          echo '<ul>'
          for f in "${rendered[@]}"; do
            name=$(basename "$f")
            echo "<li><a href=\"$name\">$name</a></li>"
          done
          echo '</ul></body></html>'
        } > "$outdir/index.html"
        printf '%s\n' "${rendered[@]}" > "$outdir/rendered.txt"
        echo "html-count=${#rendered[@]}" >> "$GITHUB_OUTPUT"
        echo "html-path=$WORKDIR/${rendered[0]}" >> "$GITHUB_OUTPUT"
        echo "artifact-dir=$WORKDIR/$outdir" >> "$GITHUB_OUTPUT"
        echo "rendered ${#rendered[@]} template(s) into $outdir"
    - if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.render.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: 14
