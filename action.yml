name: Render Email Template
description: Build and render one or more email templates into static HTML

branding:
  icon: mail
  color: blue

inputs:
  input:
    description: Path to a single source Markdown/AST, relative to working-directory. Ignored when templates or command is set.
    required: false
    default: ""
  output:
    description: Path to save a single compiled HTML file, relative to working-directory. Ignored when templates or command is set.
    required: false
    default: ""
  templates:
    description: |
      One template per line, as input:output, both relative to working-directory.
      Example:
        src/welcome.md:generated/welcome.html
        src/invoice.md:generated/invoice.html
      When set, input and output are ignored. Ignored when command is set.
    required: false
    default: ""
  command:
    description: |
      Shell command run after install, instead of the build-script loop.
      Use this for a catalog engine, for example `npx generate-template --all --out=generated`
      or `npm run sandbox`. Set artifact-directory to the folder that command writes.
    required: false
    default: ""
  node-version:
    description: Node.js version to install on the runner
    required: false
    default: "24"
  working-directory:
    description: Directory that contains package.json. Default is the generated output folder.
    required: false
    default: generated
  install-command:
    description: Command that installs dependencies in working-directory, for example `npm ci`. The cache input only controls the setup-node cache.
    required: false
    default: npm install
  build-script:
    description: npm script that compiles the email (consumer package.json). Ignored when command is set.
    required: false
    default: build-email
  validate-script:
    description: npm script that validates compiled HTML. Set empty to skip. If the script is not defined in package.json, validation is skipped with a warning. Ignored when command is set.
    required: false
    default: validate-email
  extra-args:
    description: Extra arguments appended after --input and --output. Ignored when command is set.
    required: false
    default: ""
  cache:
    description: setup-node cache mode (npm, yarn, pnpm). Empty skips cache so a missing lockfile does not fail the job.
    required: false
    default: ""
  upload-artifact:
    description: Upload the rendered HTML (plus index.html) as a workflow artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: rendered-email
  artifact-directory:
    description: Directory to index and upload, relative to working-directory. Empty uses the directory of the rendered HTML. Required in practice when command is set.
    required: false
    default: ""
  retention-days:
    description: Days to keep the uploaded artifact
    required: false
    default: "14"
  pr-comment:
    description: On pull_request, post or update a comment listing the rendered files. The caller job needs pull-requests write. Skipped for pull requests from forks, which only get a read-only token.
    required: false
    default: "true"

outputs:
  html-path:
    description: Path to the first generated HTML file, relative to the workspace
    value: ${{ steps.render.outputs.html-path }}
  html-count:
    description: Number of HTML files rendered
    value: ${{ steps.render.outputs.html-count }}
  artifact-dir:
    description: Directory that was indexed and uploaded, relative to the workspace
    value: ${{ steps.render.outputs.artifact-dir }}
  artifact-url:
    description: URL of the uploaded artifact. Empty when upload-artifact is not true.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: "composite"
  steps:
    - if: ${{ inputs.cache != '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/**/${{ inputs.cache == 'yarn' && 'yarn.lock' || inputs.cache == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
    - if: ${{ inputs.cache == '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: bash -c "$INSTALL_COMMAND"
    - name: Render templates
      id: render
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEMPLATES: ${{ inputs.templates }}
        SINGLE_INPUT: ${{ inputs.input }}
        SINGLE_OUTPUT: ${{ inputs.output }}
        BUILD_SCRIPT: ${{ inputs.build-script }}
        VALIDATE_SCRIPT: ${{ inputs.validate-script }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        COMMAND: ${{ inputs.command }}
        WORKDIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        has_script() {
          node -e 'const s=(require(require("path").resolve("package.json")).scripts)||{};process.exit(Object.prototype.hasOwnProperty.call(s,process.argv[1])?0:1)' "$1"
        }
        rel() {
          node -e 'console.log(require("path").relative(process.argv[1],process.argv[2]))' "$1" "$2"
        }
        esc() {
          sed -e 's/&/\&/g' -e 's/</\</g' -e 's/>/\>/g' -e 's/"/\"/g'
        }
        explain_failure() {
          local what="$1"
          local detail="$2"
          echo ""
          echo "::error::${what}"
          echo "----------------------------------------"
          echo "$detail"
          echo "----------------------------------------"
          echo "Common next checks:"
          echo "  - Does the npm script exist in package.json?"
          echo "  - Does the script accept the flags the action passes (--input / --output)?"
          echo "  - Did the script write a non-empty HTML file at the expected path?"
          echo "  - Look at the lines above for the actual script output (tsc, node, etc.)."
          echo ""
        }
        rendered=()
        if [ -n "$COMMAND" ]; then
          echo "running command: $COMMAND"
          if ! bash -lc "$COMMAND"; then
            explain_failure "command mode failed" "The command exited non-zero:\n  $COMMAND\n\nNo HTML was indexed. Check the command output above."
            exit 1
          fi
          if [ -z "$ARTIFACT_DIRECTORY" ]; then
            explain_failure "missing artifact-directory" "command mode requires the artifact-directory input so the action knows which folder to index."
            exit 1
          fi
          outdir="$ARTIFACT_DIRECTORY"
          mkdir -p "$outdir"
          while IFS= read -r f; do
            rendered+=("$f")
          done < <(find "$outdir" -name '*.html' ! -name 'index.html' | sort)
        else
          if [ -z "$BUILD_SCRIPT" ]; then
            explain_failure "missing build-script" "script mode requires a build-script input (or set command instead)."
            exit 1
          fi
          if ! has_script "$BUILD_SCRIPT"; then
            explain_failure "build-script not found" "npm script '$BUILD_SCRIPT' is not defined in package.json.\n\nAdd it, or set the build-script input to a script that exists."
            exit 1
          fi
          mapfile -t pairs < <(
            if [ -n "$TEMPLATES" ]; then
              printf '%s\n' "$TEMPLATES"
            else
              printf '%s:%s\n' "$SINGLE_INPUT" "$SINGLE_OUTPUT"
            fi
          )
          for raw in "${pairs[@]}"; do
            line=$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            input=${line%%:*}
            output=${line#*:}
            if [ -z "$input" ] || [ -z "$output" ] || [ "$input" = "$output" ]; then
              explain_failure "invalid template line" "Expected input:output, got: $line"
              exit 1
            fi
            echo "rendering $input -> $output"
            echo "  script: npm run $BUILD_SCRIPT -- --input $input --output $output $EXTRA_ARGS"
            if ! npm run "$BUILD_SCRIPT" -- --input "$input" --output "$output" $EXTRA_ARGS; then
              explain_failure "render failed for $input" "npm run $BUILD_SCRIPT exited non-zero while rendering:\n  input:  $input\n  output: $output\n\nThe script's own output is above (for example a tsc error, a missing template, or a non-zero exit from the node process). Fix the consumer script or its dependencies, then re-run."
              exit 1
            fi
            if [ -n "$VALIDATE_SCRIPT" ]; then
              if has_script "$VALIDATE_SCRIPT"; then
                if ! npm run "$VALIDATE_SCRIPT" -- --file "$output"; then
                  explain_failure "validation failed for $output" "npm run $VALIDATE_SCRIPT exited non-zero on:\n  $output\n\nCheck the validation script output above."
                  exit 1
                fi
              else
                echo "::warning::validate-script '$VALIDATE_SCRIPT' is not defined in package.json; skipping validation"
              fi
            fi
            if [ ! -s "$output" ]; then
              explain_failure "empty or missing output" "The build script succeeded but did not produce a non-empty file at:\n  $output\n\nConfirm the script actually writes that path (it may ignore --output or write elsewhere)."
              exit 1
            fi
            rendered+=("$output")
          done
          if [ -n "$ARTIFACT_DIRECTORY" ]; then
            outdir="$ARTIFACT_DIRECTORY"
          else
            outdir=$(dirname "${rendered[0]}")
          fi
        fi
        if [ "${#rendered[@]}" -eq 0 ]; then
          explain_failure "no templates rendered" "Set command plus artifact-directory, templates, or both input and output. Nothing was written."
          exit 1
        fi
        mkdir -p "$outdir"
        {
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rendered emails</title></head><body>'
          echo '<h1>Rendered emails</h1>'
          echo '<ul>'
          for f in "${rendered[@]}"; do
            name=$(rel "$outdir" "$f" | esc)
            echo "<li><a href=\"$name\">$name</a></li>"
          done
          echo '</ul></body></html>'
        } > "$outdir/index.html"
        printf '%s\n' "${rendered[@]}" > "$outdir/rendered.txt"
        echo "html-count=${#rendered[@]}" >> "$GITHUB_OUTPUT"
        echo "html-path=$WORKDIR/${rendered[0]}" >> "$GITHUB_OUTPUT"
        echo "artifact-dir=$WORKDIR/$outdir" >> "$GITHUB_OUTPUT"
        echo "rendered ${#rendered[@]} template(s) into $outdir"
    - if: ${{ inputs.upload-artifact == 'true' }}
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.render.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
    - name: Comment on the pull request
      if: ${{ github.event_name == 'pull_request' && inputs.pr-comment == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v9
      env:
        ARTIFACT_DIR: ${{ steps.render.outputs.artifact-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const renderedPath = path.join(process.env.ARTIFACT_DIR, 'rendered.txt');
          const list = fs.readFileSync(renderedPath, 'utf8')
            .split('\n')
            .map((line) => line.trim())
            .filter(Boolean)
            .map((line) => `- \`${line}\``)
            .join('\n');
          const uploaded = process.env.UPLOAD_ARTIFACT === 'true';
          const artifactLine = process.env.ARTIFACT_URL
            ? `- Artifact: [\`${process.env.ARTIFACT_NAME}\`](${process.env.ARTIFACT_URL})`
            : `- Artifact: \`${process.env.ARTIFACT_NAME}\``;
          const hidden = '<!-- email-template-workflows -->';
          const body = [
            hidden,
            '### Rendered emails',
            '',
            'This PR rendered email templates.',
            '',
            list,
            '',
            `- Run: ${runUrl}`,
            ...(uploaded ? [artifactLine, '', 'Open the run → **Artifacts** → download → open `index.html`.'] : []),
          ].join('\n');
          const legacyMarkers = [
            '### Rendered emails',
            '### Sandbox HTML',
            '### Fixture emails rendered',
            '### Fixture email rendered',
            '### Emails rendered',
          ];
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });
          const isBot = (c) => c.user?.type === 'Bot';
          const existing =
            comments.find((c) => isBot(c) && c.body?.includes(hidden)) ||
            comments.find((c) => isBot(c) && legacyMarkers.some((marker) => c.body?.includes(marker)));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
          }
