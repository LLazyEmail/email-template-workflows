name: Render Email Template
description: Build and render email templates into static HTML

inputs:
  input:
    description: Path to source Markdown/AST, relative to working-directory
    required: true
  output:
    description: Path to save compiled HTML, relative to working-directory
    required: true
  node-version:
    description: Node.js version to install on the runner
    required: false
    default: "24"
  working-directory:
    description: Directory that contains package.json. Default is the generated output folder.
    required: false
    default: generated
  build-script:
    description: npm script that compiles the email (consumer package.json)
    required: false
    default: build-email
  validate-script:
    description: npm script that validates compiled HTML. Set empty to skip.
    required: false
    default: validate-email
  extra-args:
    description: Extra arguments appended after --input and --output
    required: false
    default: ""
  cache:
    description: setup-node cache mode (npm, yarn, pnpm). Empty skips cache so a missing lockfile does not fail the job.
    required: false
    default: ""
  upload-artifact:
    description: Upload the rendered HTML as a workflow artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: rendered-email

outputs:
  html-path:
    description: Path to the generated HTML file, relative to the workspace
    value: ${{ inputs.working-directory }}/${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - if: ${{ inputs.cache != '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/**/package-lock.json
    - if: ${{ inputs.cache == '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
    - run: npm install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - run: npm run ${{ inputs.build-script }} -- --input "${{ inputs.input }}" --output "${{ inputs.output }}" ${{ inputs.extra-args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - if: ${{ inputs.validate-script != '' }}
      run: npm run ${{ inputs.validate-script }} -- --file "${{ inputs.output }}"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Write index.html for browsable artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      id: index
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        outdir=$(dirname "${{ inputs.output }}")
        mkdir -p "$outdir"
        {
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Rendered emails</title></head><body>'
          echo '<h1>Rendered emails</h1>'
          echo '<ul>'
          for f in "$outdir"/*.html; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ "$name" = index.html ]; then continue; fi
            echo "<li><a href=\"$name\">$name</a></li>"
          done
          echo '</ul></body></html>'
        } > "$outdir/index.html"
        echo "artifact-dir=${{ inputs.working-directory }}/$outdir" >> $GITHUB_OUTPUT
        echo "Wrote index.html in $outdir"
    - if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.index.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: 14
