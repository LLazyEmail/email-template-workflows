name: Render Email Template
description: Build and render email templates into static HTML

inputs:
  input:
    description: Path to source Markdown/AST
    required: true
  output:
    description: Path to save compiled HTML
    required: true
  upload-artifact:
    description: Upload the rendered HTML as a workflow artifact
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: rendered-email

outputs:
  html-path:
    description: Path to the generated HTML file
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - run: npm install
      shell: bash
    - run: npm run build-email -- --input ${{ inputs.input }} --output ${{ inputs.output }}
      shell: bash
    - run: npm run validate-email -- --file ${{ inputs.output }}
      shell: bash
    - if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v3
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
