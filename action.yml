name: Render Email Template
description: Build and render email templates into static HTML

inputs:
  input:
    description: Path to source Markdown/AST
    required: true
  output:
    description: Path to save compiled HTML
    required: true
  node-version:
    description: Node.js version to install on the runner
    required: false
    default: "24"

outputs:
  html-path:
    description: Path to the generated HTML file
    value: ${{ inputs.output }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm install
      shell: bash
    - run: npm run build-email -- --input ${{ inputs.input }} --output ${{ inputs.output }}
      shell: bash
    - run: npm run validate-email -- --file ${{ inputs.output }}
      shell: bash
    - uses: actions/upload-artifact@v3
      with:
        name: rendered-email
        path: ${{ inputs.output }}
